<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Scout</title>
<style>
:root{--bg:#070B09;--bar:#0A1310;--card:rgba(10,18,15,0.95);--line:#1D4A3C;--ctl:#12261F;--ctl2:#18332A;--edge:#2F6B58;--tx:#E1F5EE;--tx2:#C9E9DD;--mut:#9FE1CB;--dim:#5F8F80;--acc:#EF9F27;--acc2:#FAC775;--accbg:#2E2104;--ok:#5DCAA5;--bad:#F09595;--coral:#F0997B;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
body.page{height:100vh;overflow:hidden}
button{font:inherit;font-size:12px;height:30px;padding:0 10px;background:var(--ctl);color:var(--tx);border:0.5px solid var(--edge);border-radius:8px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
button:hover{background:var(--ctl2)}
button:focus-visible,[tabindex]:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.pr{background:var(--acc);color:#2E2104;border-color:var(--acc);font-weight:600}
button.pr:hover{background:var(--acc2)}
button.gh{background:transparent;border-color:transparent}
button.ic{width:30px;padding:0;justify-content:center}
button.sm{height:24px;padding:0 8px;font-size:11px}
button:disabled,select:disabled{opacity:.45;cursor:not-allowed}
button:disabled:hover{background:var(--ctl)}
button.on{border-color:var(--acc);color:var(--acc2);background:var(--accbg)}
svg.i{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{position:relative;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:0.5px solid var(--line);background:var(--bg)}
body.page .app{height:100vh;border-radius:0;border:none}
.tbar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:0.5px solid var(--line);background:var(--bar);flex-wrap:wrap}
.grp{display:inline-flex;align-items:center;border:0.5px solid var(--edge);border-radius:8px;overflow:hidden;height:30px}
.grp select{height:30px;border:none;background:#0B1612;color:var(--tx);font:inherit;font-size:12px;padding:0 6px}
.grp button{border:none;border-left:0.5px solid var(--edge);border-radius:0}
.stat{font-size:11px;color:var(--mut);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.stage{position:relative;flex:1;min-height:0}
canvas{display:block;width:100%;height:560px;cursor:grab;touch-action:none}
.app.tall canvas{height:740px}
body.page canvas,.app.full canvas{height:100%}
body.page .stage,.app.full .stage{display:flex}
.card{position:absolute;background:var(--card);border:0.5px solid var(--line);border-radius:10px;padding:12px;font-size:12px}
.pn{top:12px;right:12px;width:260px;max-height:calc(100% - 24px);overflow:auto}
.t{font-size:14px;font-weight:600;margin:0;overflow-wrap:anywhere}
.p{font-size:11px;color:var(--ok);margin:2px 0 8px;overflow-wrap:anywhere}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
button.mb{display:block;height:auto;padding:6px 8px;text-align:left;background:var(--ctl);border:0.5px solid transparent;border-radius:6px;white-space:normal;width:100%}
button.mb:hover{border-color:var(--acc)}
.mb span{display:flex;justify-content:space-between;color:var(--mut);font-size:11px}
.mb b{display:block;font-size:14px;font-weight:600;overflow-wrap:anywhere}
p.i{color:var(--tx2);margin:0 0 8px}
.chip{border-radius:14px;margin:0 4px 4px 0}
input,textarea{width:100%;font:inherit;font-size:12px;background:#0B1612;color:var(--tx);border:0.5px solid var(--edge);border-radius:6px;padding:6px 8px}
pre{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;background:#0B1612;color:var(--mut);border-radius:6px;padding:6px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:140px;overflow:auto;margin:6px 0 0}
summary{color:var(--ok);cursor:pointer;font-size:11px}
.k{color:var(--mut);font-size:11px;margin:10px 0 4px}
.sr{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:0.5px solid var(--line)}
label.ck{display:flex;align-items:center;gap:8px;padding:4px 0;color:var(--tx2);cursor:pointer}
label.ck input{width:auto}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.err{color:var(--bad);font-size:11px;margin:4px 0 0}
.lg{top:12px;left:12px;width:226px}
.lg.mini{width:auto;padding:6px}
.lbar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-top:0.5px solid var(--line);background:var(--bar);overflow-x:auto}
.lbar .k{margin:0 4px 0 0;white-space:nowrap}
.lr{display:flex;align-items:center;gap:8px;padding:3px 4px;border-radius:6px;color:var(--tx2)}
.lr:hover{background:var(--ctl)}
.pc{left:12px;bottom:12px;width:310px;transition:opacity .5s}
/* While a scout runs, its progress sits in the middle of the map (left of the side panel). */
.pc.mid{left:calc(50% - 142px);top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(380px,calc(100% - 340px));min-width:280px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.45);z-index:4}
.pc.mid b{font-size:13px}
.gone{opacity:0;pointer-events:none}
.pg{height:4px;background:var(--ctl);border-radius:2px;overflow:hidden;margin:8px 0}
.pg div{height:100%;background:var(--acc);transition:width .3s}
.tb{display:grid;grid-template-columns:16px 1fr 40px 52px 56px;gap:4px 6px;align-items:center}
.tb .h{color:var(--dim);font-size:10.5px}
.n{text-align:right;font-variant-numeric:tabular-nums}
.ln{display:flex;gap:6px;align-items:center;padding:2px 0;color:var(--tx2)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin:0 4px}
.tip{position:absolute;pointer-events:none;width:240px;background:#0B1612;border:0.5px solid var(--edge);border-radius:8px;padding:8px 10px;font-size:11.5px;color:var(--tx2);display:none}
.tip b{color:var(--tx);font-weight:600}
.tour{left:50%;bottom:16px;transform:translateX(-50%);width:340px;border-color:var(--acc)}
.banner{left:50%;top:12px;transform:translateX(-50%);width:340px;border-color:var(--acc)}
.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--accbg);border:0.5px solid var(--acc);color:var(--acc2);font-size:12px;padding:6px 12px;border-radius:8px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;display:none;z-index:5}
.modal{position:absolute;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:6}
.mc{width:min(640px,94%);max-height:88%;display:flex;flex-direction:column;background:var(--bar);border:0.5px solid var(--edge);border-radius:12px;padding:14px}
.mc .sc{overflow:auto;margin-top:10px;border:0.5px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{position:sticky;top:0;background:var(--ctl);color:var(--mut);font-weight:600;text-align:left;padding:7px 8px;cursor:pointer;white-space:nowrap}
td{padding:7px 8px;border-top:0.5px solid var(--line);color:var(--tx2);vertical-align:top}
tr.cl{cursor:pointer}
tr.cl:hover td{background:var(--ctl)}
a{color:var(--ok)}
.qa{background:var(--ctl);border-radius:6px;padding:8px;margin:8px 0 0}
.qa b{color:var(--acc2);font-weight:600}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);text-align:center;padding:24px;pointer-events:none}
.app.compact .stat{display:none}
.app.compact #bPlan .lbl-long{display:none}
#bPlan .lbl-short{display:none}
.app.compact #bPlan .lbl-short{display:inline}
.app.narrow .pn{position:static;width:auto;max-height:none;margin:8px;border-radius:10px}
.app.narrow .pc{position:static;width:auto;margin:8px}
.app.narrow .pc.mid{position:absolute;left:50%;width:calc(100% - 32px);min-width:0;margin:0}
.app.narrow .lg:not(.mini){width:200px}
.app.narrow canvas{height:420px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.pc,.pg div{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="tbar">
    <button class="gh" id="bSes" aria-label="Switch session"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span id="sesName">App Scout</span><svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    <span class="stat" id="stat" role="button" tabindex="0" title="Show scout details"></span>
    <span style="flex:1"></span>
    <div class="grp"><label class="sr-only" for="nApps">Most apps per platform</label><select id="nApps"><option value="50">50 / platform</option><option value="100" selected>100 / platform</option><option value="200">200 / platform</option><option value="300">300 / platform</option><option value="500">500 / platform</option></select><button id="bScout"><svg class="i" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>Scout</button></div>
    <button class="pr" id="bPlan"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg><span class="lbl-long">Plan from idea</span><span class="lbl-short">Plan</span></button>
    <button class="ic" id="bExport" aria-label="Export this session" title="Export this session"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg></button>
    <button class="ic" id="bBrowser" aria-label="Copy the map link" title="Copy the map link to open it in another browser"><svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg></button>
    <button class="ic" id="bFull" aria-label="Full screen" title="Full screen"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Market map. Each dot is an app; close dots are similar apps."></canvas>
    <div class="empty" id="empty"></div>
    <div class="card lg mini" id="lg"></div>
    <div class="card pn" id="pn" aria-live="polite"></div>
    <div class="card pc gone" id="pc" aria-live="polite"></div>
    <div class="card banner" id="banner" style="display:none"></div>
    <div class="tip" id="tip"></div>
    <div class="card tour" id="tour" style="display:none" role="dialog" aria-label="How to read the map"></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="modal" id="modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="mtitle"></div>
  </div>
  <div class="lbar" id="lbar" role="toolbar" aria-label="Lenses" style="display:none"></div>
</div>
<script>
(function () {
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const fmt = (n) => n == null ? '—' : n >= 1e9 ? (n / 1e9).toFixed(1).replace('.0', '') + 'B' : n >= 1e6 ? (n / 1e6).toFixed(1).replace('.0', '') + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(Math.round(n));
const TIER = ['dim', 'medium', 'bright'];
const BR = ['#2F6B58', '#5DCAA5', '#E1FBF2'], BA = [0.8, 0.92, 1], RAD = [2, 3.4, 5.4], RING = ['#5C7A96', '#8FB3D9', '#D6E8FA'];
const LENS = {
  leaders: { label: 'Leaders', f: (a) => a.rb === 2 && a.t === 2 },
  gaps: { label: 'Money gaps', f: (a) => a.t === 2 && a.rb === 0 },
  premium: { label: 'Premium niche', f: (a) => a.rb >= 1 && a.t === 0 },
  unknown: { label: 'Unknown revenue', f: (a) => a.r == null },
};

// ------------------------------------------------------------------ server
// The page is served by the plugin's local server and talks only to it: HTTP for actions until
// the WebSocket is up, then the WebSocket for actions and pushes. The same link can be open in
// Claude's in-app browser and in a normal browser tab at once; all state lives on the server,
// so every copy shows the same sessions, questions and answers.
const qs = new URLSearchParams(location.search);
const TOKEN = qs.get('t') || '';
async function api(action, args) { const r = await fetch('/api/action?t=' + encodeURIComponent(TOKEN), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, args }) }); const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Action failed'); return j; }
const mapUrl = (sid) => location.origin + '/?s=' + encodeURIComponent(sid) + '&t=' + encodeURIComponent(TOKEN);
document.body.classList.add('page');

// ------------------------------------------------------------------ state
let D = null;           // current snapshot from the server
let plan = null;        // plan payload, when the view was opened by plan_research
let mode = 'focus';     // right panel: focus | plan | sessions | export | idea
let sel = null, focus = null, lastKey = '', ask = false, q = '', askState = null;
let lens = null, hl = null, lgOpen = false, tourStep = -1, tourT = null, mState = null;
let pcShow = true, pcHideT = null, wasRunning = false, sessionsList = null, exSel = new Set(['apps', 'platforms', 'reviews', 'segments', 'openings', 'questions']), exFmt = 'md';
let ws = null, wsOk = false, fallbackT = null, lastAnswer = null, userMoved = false;
const pos = new Map();  // app id -> { x, y } currently drawn (for smooth moves)
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, k = 1, cx = 500, cy = 300, anim = null, moveAnim = null;

const running = () => D && (D.session.status === 'crawling' || D.session.status === 'queued');
const apps = () => (D ? D.apps : []);
const segById = (id) => D && D.segments.find((s) => s.id === id);
const kwById = (id) => D && D.keywords.find((x) => x.id === id);

// ------------------------------------------------------------------ live connection
// One socket per page, opened at start and kept open. It tells the server which session the
// page shows ('sub'), so pushes for that session reach it; 'session' and 'plan' pushes reach
// every page. After a reconnect the page reloads its snapshot, so nothing missed while the
// socket was down stays missing.
function connectWs() {
  if (ws && ws.readyState <= 1) return;
  let sock;
  try { sock = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?t=' + encodeURIComponent(TOKEN) + '&s=' + encodeURIComponent(D ? D.session.id : '')); } catch (e) { return startFallback(); }
  ws = sock;
  sock.onopen = () => { wsOk = true; stopFallback(); if (D) { subscribe(); refresh(); } };
  sock.onclose = () => { wsOk = false; if (ws === sock) { ws = null; if (running()) startFallback(); setTimeout(connectWs, 4000); } };
  sock.onerror = () => {};
  sock.onmessage = (ev) => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } onWs(m); };
}
let subbed = null;
function subscribe() { if (!D || !wsOk || subbed === D.session.id) return; subbed = D.session.id; ws.send(JSON.stringify({ type: 'sub', session: D.session.id })); }
let wsSeq = 0; const wsWait = new Map();
function wsAction(action, args) { return new Promise((resolve, reject) => { const id = ++wsSeq; wsWait.set(id, { resolve, reject }); ws.send(JSON.stringify({ type: 'action', id, action, args })); }); }
async function act(action, args) { return wsOk && ws && ws.readyState === 1 ? wsAction(action, args) : api(action, args); }
let refreshing = false, again = false;
async function refresh() { if (!D) return; if (refreshing) { again = true; return; } refreshing = true; try { setData(await act('snapshot', { session: D.session.id })); } catch (e) {} refreshing = false; if (again) { again = false; refresh(); } }
async function onWs(m) {
  if (m.type === 'result') { const w = wsWait.get(m.id); if (w) { wsWait.delete(m.id); m.error ? w.reject(new Error(m.error)) : w.resolve(m.result); } return; }
  if (m.type === 'changed') { lastPush = Date.now(); return refresh(); }
  if (m.type === 'answer') { lastAnswer = m.question; toast('Claude answered: ' + m.question.text.slice(0, 40)); refresh(); return; }
  // A scout started anywhere (by Claude, or on another open page): follow it.
  if (m.type === 'session' && (!D || D.session.id !== m.id)) { try { mode = 'focus'; setData(await act('snapshot', { session: m.id })); homeCamera(true); toast('Showing the new scout: ' + m.name); } catch (e) {} return; }
  if (m.type === 'plan') { try { setData(await act('plan', { id: m.id })); toast('Claude sent a research plan'); } catch (e) {} }
}
// While a crawl runs and no push came for 5 seconds, ask anyway, so the page never sits on a
// stale view.
let lastPush = Date.now();
setInterval(() => { if (running() && wsOk && Date.now() - lastPush > 5000) { lastPush = Date.now(); refresh(); } }, 2500);
// While the socket is down, refresh while (and only while) a crawl runs.
function startFallback() { if (fallbackT || !running()) return; fallbackT = setInterval(() => { if (!running()) return stopFallback(); refresh(); }, 2500); }
function stopFallback() { clearInterval(fallbackT); fallbackT = null; }

function askText(qq) {
  return `[App Scout · session ${D.session.id} · question ${qq.id}]\n${qq.text}\n\nMap context: ${JSON.stringify(qq.context)}\n\nAnswer here, then call answer_question (session ${D.session.id}, question_id ${qq.id}) so the map shows the answer.`;
}

// ------------------------------------------------------------------ data in
function setData(snap) {
  if (!snap) return;
  if (snap.view === 'plan') { plan = snap.plan; mode = 'plan'; if (!D) { D = null; } render(); return; }
  if (snap.view === 'error') { toast(snap.message); return; }
  const first = !D || D.session.id !== snap.session.id;
  const prev = D;
  D = snap;
  const phaseChanged = !first && prev && (prev.session.status !== D.session.status || prev.session.groupedBy !== D.session.groupedBy);
  if (first) { userMoved = false; pos.clear(); sel = null; homeCamera(); lens = (D.viewState && D.viewState.lens) || null; pcShow = running(); mode = mode === 'plan' && plan ? 'plan' : 'focus'; history.replaceState(null, '', mapUrl(D.session.id).slice(location.origin.length)); }
  if (sel && sel.id) sel = findById(sel.kind, sel.id);
  $('sesName').textContent = D.session.name;
  $('nApps').value = String([50, 100, 200, 300, 500].includes(D.session.target) ? D.session.target : 100);
  moveDots(first);
  // Keep the whole map in view while it grows and when it regroups, until the user moves it.
  if (!first && !userMoved && (running() || phaseChanged)) homeCamera(phaseChanged);
  const nowRunning = running();
  if (nowRunning) { if (!wasRunning) pcShow = true; clearTimeout(pcHideT); }
  if (wasRunning && !nowRunning) {
    clearTimeout(pcHideT);
    pcHideT = setTimeout(() => { pcShow = false; progress(); }, 1600);
    toast(D.session.status === 'failed' ? 'Scout failed: ' + (D.session.error || '') : `Scout finished · ${D.apps.length} apps · saved`);
  }
  wasRunning = nowRunning;
  if (D.session.status === 'ready' && !D.prefs.tourDone && tourStep < 0 && D.apps.length) setTimeout(startTour, 1800);
  subscribe();
  if (nowRunning && !wsOk) startFallback();
  lastKey = '';
  render();
}
function findById(kind, id) {
  if (kind === 'app') return apps().find((a) => a.id === id) && { kind, id };
  if (kind === 'segment') return segById(id) && { kind, id };
  if (kind === 'keyword') return kwById(id) && { kind, id };
  if (kind === 'opening') return D.openings.find((o) => o.id === id) && { kind, id };
  return null;
}
function moveDots(instant) {
  const from = new Map(pos);
  const t0 = performance.now();
  cancelAnimationFrame(moveAnim);
  if (instant) { for (const a of apps()) pos.set(a.id, { x: a.x, y: a.y }); return draw(); }
  const step = (t) => {
    const u = Math.min(1, (t - t0) / 700), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    for (const a of apps()) { const f = from.get(a.id) || { x: a.x, y: a.y }; pos.set(a.id, { x: f.x + (a.x - f.x) * e, y: f.y + (a.y - f.y) * e }); }
    draw();
    if (u < 1) moveAnim = requestAnimationFrame(step);
  };
  moveAnim = requestAnimationFrame(step);
}

// ------------------------------------------------------------------ map drawing
const base = () => W / 1000;
const sx = (x) => (x - cx) * k * base() + W / 2, sy = (y) => (y - cy) * k * base() + H / 2;
const panelOff = () => (document.getElementById('app').classList.contains('narrow') ? 0 : 130 / (k * base()));
const fade = (v, a, b, c, d) => (v < a || v > d ? 0 : v < b ? (v - a) / (b - a) : v <= c ? 1 : (d - v) / (d - c));
const P = (a) => pos.get(a.id) || a;
// Labels claim a box each frame; a label that would overlap one already drawn is skipped.
// drawnLabels is exposed as window.__appScoutLabels so the e2e test can check what's on screen.
let boxes = [], drawnLabels = [];
function label(t, x, y, px, col, al, w, force) {
  if (al <= 0.02) return false;
  ctx.font = (w || 400) + ' ' + px + 'px system-ui,sans-serif';
  const tw = ctx.measureText(t).width;
  const bx = { x1: x - tw / 2 - 3, x2: x + tw / 2 + 3, y1: y - px / 2 - 2, y2: y + px / 2 + 2 };
  if (!force && boxes.some((o) => !(bx.x2 < o.x1 || bx.x1 > o.x2 || bx.y2 < o.y1 || bx.y1 > o.y2))) return false;
  boxes.push(bx);
  drawnLabels.push(t);
  ctx.globalAlpha = al; ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t, x, y); ctx.globalAlpha = 1;
  return true;
}
function size() {
  const r = window.devicePixelRatio || 1;
  const app = $('app');
  app.classList.toggle('narrow', app.clientWidth < 600);
  app.classList.toggle('compact', app.clientWidth < 760);

  panel();
});

// map pointer: drag to move, wheel/pinch to zoom, click to select, hover to explain a dot
let drag = null, moved = false;
cv.addEventListener('wheel', (e) => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
cv.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, cx, cy }; moved = false; cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; $('tip').style.display = 'none'; });
cv.addEventListener('pointermove', (e) => {
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) { moved = true; userMoved = true; } cx = drag.cx - dx / (k * base()); cy = drag.cy - dy / (k * base()); draw(); return; }
  const tip = $('tip');
  if (!encReady()) { tip.style.display = 'none'; return; }
  let best = null, bd = 12; for (const a of apps()) { const p = P(a); const d = Math.hypot(sx(p.x) - px, sy(p.y) - py); if (d < bd) { bd = d; best = a; } }
  if (!best) { tip.style.display = 'none'; return; }
  const e2 = enc(best), look = ['small', 'medium', 'big'][best.rb == null ? 1 : best.rb] + ', ' + TIER[e2.br] + ', ' + (e2.hollow ? 'hollow' : 'filled');
  tip.innerHTML = '<b>' + esc(best.n) + '</b> · ' + look + '<br>Est. revenue: ' + esc(best.rl) + (best.rm ? ' <span style="color:var(--dim)">(' + esc(best.rc || 'L') + ')</span>' : '') + '<br>Users: ' + esc(best.ul || 'n/a') + ' · ' + TIER[best.t] + ' within ' + esc(D.storeLabels[best.s]) + (best.seg ? '<br><span style="color:var(--ok)">' + esc([(segById(best.seg) || {}).name, (kwById(best.kw) || {}).name].filter(Boolean).join(' › ')) + '</span>' : '');
  tip.style.display = 'block'; tip.style.left = Math.min(px + 14, W - 250) + 'px'; tip.style.top = Math.min(py + 14, H - 110) + 'px';
});
cv.addEventListener('pointerleave', () => ($('tip').style.display = 'none'));
cv.addEventListener('pointerup', (e) => {
  cv.style.cursor = 'grab'; const was = drag; drag = null; if (!D) return; if (moved) return saveView(); if (!was) return;
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  if (mode !== 'focus') { mode = 'focus'; }
  const o = encReady() && D.openings.find((o) => Math.hypot(sx(o.x) - px, sy(o.y) - py) < 16); if (o) return select({ kind: 'opening', id: o.id });
  let best = null, bd = 10; for (const a of apps()) { const p = P(a); const d = Math.hypot(sx(p.x) - px, sy(p.y) - py); if (d < bd) { bd = d; best = a; } }
  if (best) return select({ kind: 'app', id: best.id });
  if (grouped() && D.segments.length) { const wx = (px - W / 2) / (k * base()) + cx, wy = (py - H / 2) / (k * base()) + cy; const g = near(D.segments, wx, wy); if (g && Math.hypot(sx(g.x) - px, sy(g.y) - py) < 90 * k * base()) return select({ kind: 'segment', id: g.id }); }
  select(null);
});
// keyboard: arrows pan, +/- zoom
cv.tabIndex = 0;
cv.addEventListener('keydown', (e) => { const s = 40 / (k * base()); if (e.key === '+' || e.key === '=') zoomAt(1.4, W / 2, H / 2); else if (e.key === '-') zoomAt(1 / 1.4, W / 2, H / 2); else if (e.key === 'ArrowLeft') cx -= s; else if (e.key === 'ArrowRight') cx += s; else if (e.key === 'ArrowUp') cy -= s; else if (e.key === 'ArrowDown') cy += s; else return; e.preventDefault(); draw(); });

// toolbar
$('bSes').onclick = async () => { if (mode === 'sessions') { mode = 'focus'; return panel(); } mode = 'sessions'; sessionsList = null; panel(); try { sessionsList = (await act('sessions', {})).sessions; } catch (e) { sessionsList = []; } panel(); };
$('bPlan').onclick = () => { mode = mode === 'idea' ? 'focus' : 'idea'; panel(); const t = $('idea'); if (t) { t.focus(); t.addEventListener('input', () => ($('ie').textContent = '')); } };
$('bExport').onclick = () => { if (!D) return toast('Run a scout first'); exFor = null; mode = mode === 'export' ? 'focus' : 'export'; panel(); };
// Copies this map's link, so the same live map can be opened in another browser too.
$('bBrowser').onclick = async () => { const url = D ? mapUrl(D.session.id) : location.href; try { await navigator.clipboard.writeText(url); toast('Link copied: open it in any browser, it stays in sync'); } catch (e) { toast(url); } };
$('stat').onclick = () => { pcShow = !pcShow; progress(); empty(); };
$('stat').onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('stat').click(); } };
$('bScout').onclick = async () => {
  if (busy()) return;
  const n = +$('nApps').value;
  starting = true; busyButtons();
  try { const snap = await act('start', { apps: n, topic: D ? D.session.topic : null, stores: D ? D.session.stores : undefined, market: D ? D.session.market : 'us', name: D ? undefined : 'Overview' }); mode = 'focus'; plan = null; setData(snap); homeCamera(true); }
  catch (e) { toast(e.message); }
  finally { starting = false; busyButtons(); }
};
$('bFull').onclick = async () => {
  try { document.fullscreenElement ? await document.exitFullscreen() : await document.documentElement.requestFullscreen(); } catch (e) { $('app').classList.toggle('tall'); size(); }
};
window.addEventListener('resize', size);
new ResizeObserver(size).observe(cv);

// ------------------------------------------------------------------ start
function render() { size(); panel(); }
(async function start() {
  try {
    const sid = qs.get('s'), pid = qs.get('plan');
    if (pid) setData(await api('plan', { id: pid }));
    if (sid) setData(await api('snapshot', { session: sid }));
    else if (!pid) { const l = (await api('sessions', {})).sessions; if (l.length) setData(await api('snapshot', { session: l[0].id })); else render(); }
  } catch (e) { toast(e.message); render(); }
  connectWs();
})();
})();
</script>
</body>
